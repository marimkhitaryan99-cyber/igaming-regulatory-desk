<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iGaming Regulatory & Market Entry Intelligence Desk</title>
  <!-- React 18 & ReactDOM -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    /* Full original CSS specification */
    .rd-root{--bg:#F2F5F8;--surface:#FFFFFF;--surface-2:#F7F9FB;--ink:#14212B;--ink-2:#2B3B48;--muted:#55687A;--line:#E1E7ED;--line-2:#CBD5DD;
      --brand:#0D5662;--brand-2:#0A434D;--brand-soft:#E2F0F2;--ring:#2F8FA3;
      --danger:#B42318;--danger-soft:#FDECEA;--danger-ink:#8C1D14;--warn:#9A5A00;--warn-soft:#FDF1D6;--warn-ink:#6A3F00;
      --info:#2F46A8;--info-soft:#E8ECFA;--info-ink:#233485;--ok:#1B6B3A;--ok-soft:#E2F3E7;--ok-ink:#14502B;
      --paper:var(--bg);--panel:var(--surface);--accent:var(--brand);--accent-ink:#FFFFFF;
      --r-lg:14px;--r:10px;--r-sm:8px;--sh1:0 1px 2px rgba(20,33,43,.06);--sh2:0 1px 2px rgba(20,33,43,.05),0 10px 28px rgba(20,33,43,.07);
      font-family:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);min-height:100vh;-webkit-font-smoothing:antialiased}
    .rd-root *{box-sizing:border-box}
    .rd-root :focus-visible{outline:3px solid var(--ring);outline-offset:2px}
    .rd-wrap{max-width:1280px;margin:0 auto;padding:0 24px 56px}
    .rd-skip{position:absolute;left:-9999px;top:8px;background:var(--brand);color:#fff;padding:10px 14px;border-radius:var(--r-sm);z-index:100;font-weight:600;text-decoration:none}
    .rd-skip:focus{left:12px}
    .rd-ic{flex:none;vertical-align:-3px}

    /* ---- top bar and tabs ---- */
    .rd-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0 12px}
    .rd-brand-cluster{display:flex;align-items:center;gap:12px}
    .rd-logo{width:40px;height:40px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--sh1);font-weight:800;font-size:18px}
    .rd-title{font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
    .rd-subtitle{font-size:13px;color:var(--muted);margin:2px 0 0}
    .rd-nav{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line-2);margin:0 -24px 22px;padding:0 24px}
    .rd-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}
    .rd-tabs::-webkit-scrollbar{display:none}
    .rd-navtab{display:flex;align-items:center;gap:6px;flex:none;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:12px 10px;font:inherit;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;scroll-snap-align:start;transition:color .12s}
    .rd-navtab:hover{color:var(--ink)}
    .rd-navtab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
    .rd-navcount{font-size:12px;font-weight:700;background:#E4EAEF;color:var(--ink-2);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
    .rd-navtab[aria-selected="true"] .rd-navcount{background:var(--brand-soft);color:var(--brand-2)}

    /* ---- page heads & components ---- */
    .rd-pagehead{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
    .rd-h2{font-size:22px;line-height:1.2;margin:0;font-weight:700}
    .rd-go{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;background:var(--brand);color:#fff;border:0;border-radius:var(--r);padding:8px 20px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:var(--sh1);transition:background .12s}
    .rd-go:hover:not(:disabled){background:var(--brand-2)}
    .rd-go:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}
    .rd-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:6px 13px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s}
    .rd-btn:hover:not(:disabled){background:var(--surface-2);border-color:var(--brand)}
    .rd-btn:disabled{opacity:.5;cursor:not-allowed}
    a.rd-btn{text-decoration:none;color:var(--ink)}
    .rd-chip{display:inline-flex;align-items:center;gap:7px;min-height:30px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap}
    .rd-chip:hover{border-color:var(--brand);background:var(--surface-2)}
    .rd-chip[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
    .rd-input{width:100%;min-height:36px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 10px;font-size:14.5px;font-family:inherit;background:var(--surface);color:var(--ink)}
    .rd-input:focus-visible{outline-offset:0;border-color:var(--ring)}
    textarea.rd-input{resize:vertical;line-height:1.45}
    .rd-link{background:none;border:0;color:var(--brand);cursor:pointer;font-size:13.5px;font-weight:600;padding:2px 4px;min-height:26px;display:inline-flex;align-items:center;font-family:inherit;text-decoration:none}
    .rd-link:hover{text-decoration:underline}
    .rd-check{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
    .rd-check input{width:16px;height:16px;accent-color:var(--brand)}
    .rd-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .rd-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
    .rd-status{font-size:13.5px;color:var(--muted);line-height:1.4}
    .rd-err{color:var(--danger-ink);font-size:13.5px;margin:4px 0 12px;background:var(--danger-soft);border-radius:var(--r-sm);padding:9px 12px}

    /* ---- panels, cards, scope ---- */
    .rd-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-bottom:16px;box-shadow:var(--sh1)}
    .rd-h{font-size:15px;font-weight:700;margin:0 0 10px}
    .rd-empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:34px 22px;text-align:center;color:var(--muted);font-size:14.5px}
    .rd-scope{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 16px;margin-bottom:14px;box-shadow:var(--sh1)}
    .rd-scope-summary{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
    .rd-pills{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;flex:1 1 360px}
    .rd-pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--ink-2)}
    .rd-pill b{font-weight:700;color:var(--ink)}
    .rd-scope-panel{border-top:1px solid var(--line);margin-top:12px;padding-top:14px}
    .rd-scope-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px 28px}
    .rd-scope-h{font-size:14px;font-weight:700;margin:0 0 8px}
    .rd-scroll{max-height:65vh;overflow-y:auto}
    .rd-seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;max-width:100%}
    .rd-seg button{border:0;background:transparent;border-radius:7px;padding:5px 11px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink-2);white-space:nowrap;min-height:30px}
    .rd-seg button:hover{background:#E9EEF2}
    .rd-seg button[aria-pressed="true"]{background:var(--brand);color:#fff;font-weight:600}
    .rd-dates{display:grid;gap:8px;margin-top:10px}
    .rd-dates label{display:grid;gap:4px;font-size:13.5px;font-weight:600}
    .rd-region{margin-top:14px}
    .rd-region-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13.5px;font-weight:700}

    /* ---- progress & notices ---- */
    .rd-progress{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:14px;box-shadow:var(--sh1)}
    .rd-progress-top{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;font-weight:600}
    .rd-bar{height:8px;background:#E4EAEF;border-radius:999px;overflow:hidden;margin-top:8px}
    .rd-bar > div{height:100%;background:var(--brand);border-radius:999px;transition:width .35s ease}
    .rd-active{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:13px;color:var(--muted)}
    .rd-active span.rd-pill{background:var(--brand-soft);border-color:transparent;color:var(--brand-2)}
    .rd-newbar{display:flex;gap:10px;align-items:flex-start;background:var(--brand-soft);border:1px solid #BFDDE3;border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:14px;line-height:1.45;color:var(--brand-2)}
    .rd-newbar-warn{background:var(--warn-soft);border-color:#EBD08F;color:var(--warn-ink)}

    /* ---- filters ---- */
    .rd-filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:14px;box-shadow:var(--sh1);min-width:0}
    .rd-filters-body{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
    .rd-frow{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;min-width:0}
    .rd-flabel{font-size:13.5px;font-weight:700;color:var(--muted);min-width:54px}
    .rd-fspace{flex:1 1 auto}
    .rd-search{position:relative;flex:1 1 240px;max-width:380px}
    .rd-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
    .rd-search .rd-input{padding-left:34px}
    .rd-chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1 1 0;min-width:0}

    /* ---- items, cards & tags ---- */
    .sev-money{--sev:var(--danger);--sev-ink:var(--danger-ink)}
    .sev-rules{--sev:#C07A00;--sev-ink:var(--warn-ink)}
    .sev-market{--sev:var(--info);--sev-ink:var(--info-ink)}
    .rd-item{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px 12px 20px;margin-bottom:10px;box-shadow:var(--sh1)}
    .rd-item::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--sev,var(--line-2))}
    .rd-item-new{background:#F4FAFB;border-color:#C7E1E6}
    .rd-meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;color:var(--muted)}
    .rd-meta strong{color:var(--ink);font-size:13.5px}
    .rd-item h4{margin:6px 0 4px;font-size:16px;line-height:1.35;font-weight:600}
    .rd-item p{margin:0 0 8px;font-size:14px;line-height:1.5;color:var(--ink-2);max-width:80ch}
    .rd-tag{font-weight:600;font-size:12px;border-radius:6px;padding:1px 7px}
    .rd-new{font-weight:700;font-size:12px;border-radius:6px;padding:1px 7px;color:#fff;background:var(--brand)}
    .rd-unv{font-weight:600;font-size:12px;border-radius:6px;padding:1px 7px;color:var(--warn-ink);background:var(--warn-soft)}
    .rd-flags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
    .rd-flag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);padding:1px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
    .rd-flag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sev,var(--line-2))}
    .rd-flagnote{margin:4px 0 6px;font-size:14px;font-weight:600;color:var(--sev-ink,var(--ink))}
    .rd-ggrline{margin:0 0 6px;font-size:14px;font-weight:600;color:var(--ok-ink)}
    .rd-cacline{margin:0 0 6px;font-size:14px;font-weight:600;color:#4A3AA0}
    .rd-item-foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted);margin-top:2px}
    .rd-item-foot a{color:var(--brand);font-weight:600;display:inline-flex;align-items:center;gap:5px;min-height:30px;text-decoration:none}
    .rd-item-foot a:hover{text-decoration:underline}
    .rd-excel{display:inline-flex;align-items:center;gap:6px;border:1px solid #BBD9C6;color:var(--ok-ink);background:#fff;border-radius:var(--r-sm);padding:3px 10px;min-height:30px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
    .rd-excel:hover{background:var(--ok-soft)}
    .rd-sent{color:var(--ok-ink);font-size:13px;font-weight:600}

    /* ---- trackers, profile, tables ---- */
    .rd-vol{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--ok);border-radius:var(--r-lg);padding:22px 24px;box-shadow:var(--sh1)}
    .rd-vol-cac{border-top-color:#4A3AA0}
    .rd-vol-prof{border-top-color:var(--brand)}
    .rd-vol-cmp{border-top-color:#2F46A8}
    .rd-vol-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:14px;margin-bottom:18px}
    .rd-vol-head h2{font-size:22px;line-height:1.2;margin:0 0 4px;font-weight:700}
    .rd-vol-head p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:75ch}
    .rd-toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:16px}
    .rd-tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
    .rd-table{width:100%;border-collapse:collapse;font-size:14px}
    .rd-table th{text-align:left;font-weight:700;font-size:13px;color:var(--muted);padding:9px 11px;background:var(--surface-2);border-bottom:1px solid var(--line-2);white-space:nowrap}
    .rd-table td{padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
    .rd-table tbody tr:hover td{background:#FAFCFD}
    .rd-table a{color:var(--brand);font-weight:600;text-decoration:none}
    .rd-table a:hover{text-decoration:underline}
    .rd-amt{font-weight:700;white-space:nowrap}
    .rd-up{color:var(--ok);font-weight:600}
    .rd-down{color:var(--danger);font-weight:600}
    .rd-tone{display:inline-block;border-radius:6px;padding:1px 7px;font-weight:600;font-size:13px}
    .rd-tone-green{background:var(--ok-soft);color:var(--ok-ink)}
    .rd-tone-amber{background:var(--warn-soft);color:var(--warn-ink)}
    .rd-tone-red{background:var(--danger-soft);color:var(--danger-ink)}
    .rd-tone-grey{background:#E9EEF2;color:var(--ink-2)}

    /* ---- country profile ---- */
    .rd-prof{border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;background:var(--surface)}
    .rd-prof-title{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:14px}
    .rd-prof-title h3{font-family:Georgia,"Times New Roman",serif;font-size:32px;line-height:1.1;margin:2px 0 0;color:var(--brand)}
    .rd-prof-kicker{font-size:13.5px;color:var(--muted)}
    .rd-prof-meta{text-align:right;font-size:13px;color:var(--muted);line-height:1.45}
    .rd-prof-status{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:6px}
    .rd-prof-box{padding:10px 12px;border-radius:var(--r)}
    .rd-prof-box small{display:block;font-size:12px;text-transform:uppercase;font-weight:600}
    .rd-prof-box strong{display:block;font-size:15px;margin-top:2px}
    .rd-prof-h{font-size:17px;font-weight:700;color:var(--brand);margin:22px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--brand)}
    .rd-prof-list{margin:0;padding-left:22px;font-size:14.5px;line-height:1.5}
    .rd-prof-note{font-size:13px;color:var(--muted);line-height:1.5;margin:10px 0 0}
    .rd-basis{font-weight:700;font-size:12.5px}

    /* ---- comparison & weights ---- */
    .rd-cmp-weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 20px;margin:8px 0 12px}
    .rd-cmp-weight{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;font-size:13.5px;font-weight:600}
    .rd-cmp-weight input{grid-column:1/2;accent-color:var(--brand);width:100%;height:26px;margin:0}
    .rd-cmp-weight output{grid-column:2/3;grid-row:1/3;font-weight:700;min-width:20px;text-align:right}
    .rd-scorebar{height:7px;background:#E4EAEF;border-radius:999px;overflow:hidden;margin-bottom:3px;min-width:85px}
    .rd-scorebar>div{height:100%;background:var(--brand);border-radius:999px}
    .rd-cmp-calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px;margin:8px 0 12px}
    .rd-cmp-calc label{display:grid;gap:3px;font-size:13.5px;font-weight:600}
    .rd-cmp-details{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--surface-2)}
    .rd-cmp-details summary{cursor:pointer;font-weight:700;font-size:14px}
    .rd-cmp-details ul{margin:8px 0;padding-left:20px;line-height:1.5;font-size:13.5px}

    /* ---- timeline calendar ---- */
    .rd-tl-cal{width:100%;border-collapse:collapse;table-layout:fixed;min-width:720px}
    .rd-tl-cal th{background:var(--surface-2);border:1px solid var(--line);padding:6px;font-size:12px;text-align:left}
    .rd-tl-cal td{border:1px solid var(--line);vertical-align:top;padding:4px 5px;height:88px;font-size:12px}
    .rd-tl-out{background:#F7F8F9;color:#8795A1}
    .rd-tl-today{outline:2px solid #14606B;outline-offset:-2px}
    .rd-tl-daynum{display:block;font-weight:700;font-size:11.5px;margin-bottom:2px}
    .rd-tl-item{border-left:4px solid #8795A1;background:#F4F6F8;border-radius:5px;padding:3px 6px;line-height:1.35;font-size:12px;margin-bottom:3px}
    .rd-tl-item .rd-tl-stage{font-size:10.5px;font-weight:800;text-transform:uppercase}
    .rd-tl-draft{border-left-color:#C98A00;background:#FFF6DE}
    .rd-tl-passed{border-left-color:#2F6DB5;background:#E8F1FC}
    .rd-tl-inforce{border-left-color:#2E8B57;background:#E4F4EA}

    /* responsive */
    @media (max-width:760px){
      .rd-wrap{padding:0 12px 40px}
      .rd-top{flex-direction:column;align-items:flex-start}
      .rd-title{font-size:20px}
      .rd-tl-cal{min-width:0;display:block}
      .rd-tl-cal thead{display:none}
      .rd-tl-cal tbody,.rd-tl-cal tr,.rd-tl-cal td{display:block;width:100%}
      .rd-tl-cal td{height:auto;border:0;border-bottom:1px solid var(--line)}
    }
  </style>
</head>
<body class="rd-root">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    /* ---------- Static Core Data ---------- */
    const REGIONS = {
      "Europe": ["Albania", "Austria", "Belgium", "Bulgaria", "Croatia", "Cyprus", "Czech Republic", "Denmark", "Estonia", "Finland", "France", "Germany", "Greece", "Ireland", "Italy", "Malta", "Netherlands", "Poland", "Portugal", "Romania", "Slovakia", "Spain", "Sweden", "United Kingdom"],
      "Caucasus & CIS": ["Armenia", "Azerbaijan", "Georgia", "Kazakhstan", "Moldova", "Uzbekistan"],
      "Latin America & Caribbean": ["Argentina", "Brazil", "Chile", "Colombia", "Costa Rica", "Curaçao", "Mexico", "Panama", "Paraguay", "Peru"],
      "North America": ["Canada", "Canada (Ontario)", "United States"],
      "Africa": ["Ghana", "Kenya", "Nigeria", "South Africa", "Tanzania", "Uganda"],
      "Asia-Pacific": ["Australia", "India", "Japan", "New Zealand", "Philippines"]
    };

    const ALL_COUNTRIES = Object.values(REGIONS).flat();
    const MY_MARKETS = ["Brazil", "Romania", "Armenia", "Germany", "Peru", "United Kingdom", "Italy", "Mexico", "Colombia"];

    const CATEGORIES = {
      Regulation: { color: "#3446A0", bg: "#E4E8F7" },
      Taxation: { color: "#8A5A00", bg: "#F8EBCF" },
      Licensing: { color: "#0B6B63", bg: "#D9F0EC" },

    function toWinAnsi(text) {
      let out = "";
      for (const ch of String(text ?? "")) {
        const cp = ch.codePointAt(0);
        if (cp >= 32 && cp < 127) out += ch;
        else if (cp >= 0xa1 && cp <= 0xff) out += ch;
        else {
          const plain = ch.normalize("NFKD").replace(/[\u0300-\u036f]/g, "");
          out += plain && /^[\x20-\x7e]+$/.test(plain) ? plain : "?";
        }
      }
      return out;
    }

    const pdfTextWidth = (str, size, bold) => {
      let total = 0;
      for (let i = 0; i < str.length; i++) total += pdfCharWidth(str.charCodeAt(i), bold);
      return (total * size) / 1000;
    };

    function createPdf(title) {
      const A4_W = 595.28, A4_H = 841.89;
      const pages = [];
      let cur = null;
      const rgb = hex => {
        const n = parseInt(hex, 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v => (v / 255).toFixed(3)).join(" ");
      };
      const f = n => n.toFixed(2);

      return {
        newPage() { cur = { ops: [], links: [] }; pages.push(cur); },
        text(x, y, str, o = {}) {
          cur.ops.push(`BT /${o.bold ? "F2" : "F1"} ${o.size || 9} Tf ${rgb(o.color || "13222E")} rg ${f(x)} ${f(A4_H - y)} Td (${toWinAnsi(str).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)")}) Tj ET`);
        },
        rect(x, y, w, h, fill) { cur.ops.push(`${rgb(fill)} rg ${f(x)} ${f(A4_H - y - h)} ${f(w)} ${f(h)} re f`); },
        box(x, y, w, h, stroke, lw = 0.5) { cur.ops.push(`${rgb(stroke)} RG ${lw} w ${f(x)} ${f(A4_H - y - h)} ${f(w)} ${f(h)} re S`); },
        hline(x1, x2, y, stroke, lw = 0.5) { cur.ops.push(`${rgb(stroke)} RG ${lw} w ${f(x1)} ${f(A4_H - y)} m ${f(x2)} ${f(A4_H - y)} l S`); },
        bytes() {
          const objs = [];
          const add = s => { objs.push(s); return objs.length; };
          add("<< /Type /Catalog /Pages 2 0 R >>");
          add("");
          add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
          add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
          const info = add(`<< /Title (${toWinAnsi(title)}) /Producer (iGaming Regulatory Desk) >>`);
          const kids = [];
          pages.forEach(p => {
            const stream = p.ops.join("\n");
            const content = add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
            const page = add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${A4_W} ${A4_H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${content} 0 R >>`);
            kids.push(page);
          });
          objs[1] = `<< /Type /Pages /Kids [${kids.map(n => `${n} 0 R`).join(" ")}] /Count ${kids.length} >>`;
          let out = "%PDF-1.4\n";
          const offsets = [];
          objs.forEach((o, i) => { offsets.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
          const xref = out.length;
          out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n${offsets.map(o => `${String(o).padStart(10, "0")} 00000 n \n`).join("")}`;
          out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF`;
          return Uint8Array.from(out, c => c.charCodeAt(0) & 255);
        }
      };
    }

    /* ---------- Pure JS Decompressor / XLSX Reader ---------- */
    async function inflateRaw(bytes) {
      if (typeof DecompressionStream === "undefined") throw new Error("DecompressionStream unsupported");
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    async function unzip(buffer) {
      const u8 = new Uint8Array(buffer);
      const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
      let eocd = -1;
      for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
        if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error("Not a valid Excel .xlsx archive");
      const count = dv.getUint16(eocd + 10, true);
      let p = dv.getUint32(eocd + 16, true);
      const files = {};
      for (let n = 0; n < count; n++) {
        if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) break;
        const method = dv.getUint16(p + 10, true);
        const csize = dv.getUint32(p + 20, true);
        const nameLen = dv.getUint16(p + 28, true);
        const extraLen = dv.getUint16(p + 30, true);
        const commLen = dv.getUint16(p + 32, true);
        const lho = dv.getUint32(p + 42, true);
        files[new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nameLen))] = { method, csize, lho };
        p += 46 + nameLen + extraLen + commLen;
      }
      return { u8, dv, files };
    }

              <div className="rd-filters">
                <div className="rd-filters-body">
                  <div className="rd-frow">
                    <div className="rd-search">
                      <svg className="rd-ic" width="16" height="16" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg>
                      <input className="rd-input" placeholder="Search country, rule, keyword..." value={query} onChange={e => setQuery(e.target.value)} />
                    </div>
                    <select className="rd-input" style={{ maxWidth: 180 }} value={flagFilter} onChange={e => setFlagFilter(e.target.value)}>
                      <option value="All">All Priority Flags</option>
                      {FLAG_RULES.map(f => <option key={f.id} value={f.id}>{f.label}</option>)}
                    </select>
                    <select className="rd-input" style={{ maxWidth: 170 }} value={catFilter} onChange={e => setCatFilter(e.target.value)}>
                      <option value="All">All Categories</option>
                      {Object.keys(CATEGORIES).map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                    {(query || flagFilter !== "All" || catFilter !== "All") && (
                      <button className="rd-link" onClick={() => { setQuery(""); setFlagFilter("All"); setCatFilter("All"); }}>Reset Filters</button>
                    )}
                  </div>
                </div>
              </div>

              {/* News Feed Cards */}
              <div>
                {filteredNews.map(it => {
                  const sev = severityOf(it.flags);
                  return (
                    <article key={it.id} className={`rd-item${it.isNew ? " rd-item-new" : ""}${sev ? ` sev-${sev}` : ""}`}>
                      <div className="rd-meta">
                        <strong>{it.country}</strong>
                        <span>{it.date}</span>
                        <span className="rd-tag" style={{ color: CATEGORIES[it.category]?.color || "#46586A", background: CATEGORIES[it.category]?.bg || "#E3E9EE" }}>{it.category}</span>
                        {it.isNew && <span className="rd-new">New Alert</span>}
                        {it.verified && <span className="rd-up">✓ Verified Source</span>}
                      </div>
                      <h4>{it.title}</h4>
                      {it.flag_note && <div className="rd-flagnote">⚠️ Executive Alert: {it.flag_note}</div>}
                      <p>{it.summary}</p>
                      <div className="rd-item-foot">
                        <div className="rd-flags">
                          {(it.flags || []).map(f => (
                            <span key={f} className={`rd-flag sev-${FLAG_SEV[f]}`}>{flagLabel(f)}</span>
                          ))}
                        </div>
                        <a href={safeUrl(it.url)} target="_blank" rel="noreferrer">Official Gazette ↗</a>
                        <button className="rd-excel" onClick={() => copyToExcelHandoff(it)}>Add to Excel File</button>
                      </div>
                    </article>
                  );
                })}
              </div>
            </section>
          )}

          {/* 2. COUNTRY DOSSIER */}
          {tab === "profile" && (
            <section className="rd-vol rd-vol-prof" aria-label="Country Dossier">
              <div className="rd-vol-head">
                <div>
                  <h2>Country Dossier Brief</h2>
                  <p>Comprehensive regulatory profile covering statutory tax rates, capitalization requirements, and market volume.</p>
                </div>
                <div className="rd-row">
                  <select className="rd-input" style={{ width: 180, fontWeight: 700 }} value={selectedCountry} onChange={e => setSelectedCountry(e.target.value)}>
                    {Object.keys(profiles).map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                  <button className="rd-go" onClick={() => downloadDossierPdf(selectedCountry)}>Download PDF Dossier</button>
                </div>
              </div>

              <div className="rd-prof">
                <div className="rd-prof-title">
                  <div>
                    <div className="rd-prof-kicker">iGaming B2C Market Expansion Dossier</div>
                    <h3>{currentProfile.country}</h3>
                  </div>
                </div>

                <div className="rd-prof-status">
                  <div className="rd-prof-box" style={{ background: "#E2F3E7", color: "#14502B" }}>
                    <small>Status</small>
                    <strong>{currentProfile.status.status}</strong>
                  </div>
                  <div className="rd-prof-box" style={{ background: "#E8ECFA", color: "#233485" }}>
                    <small>Online Casino</small>
                    <strong>{currentProfile.status.casino}</strong>
                  </div>
                  <div className="rd-prof-box" style={{ background: "#E4E8F7", color: "#3446A0" }}>
                    <small>Sports Betting</small>
                    <strong>{currentProfile.status.sports}</strong>
                  </div>
                  <div className="rd-prof-box" style={{ background: "#FDF1D6", color: "#6A3F00" }}>
                    <small>Foreign Entity</small>
                    <strong>{currentProfile.status.foreign}</strong>
                  </div>
                </div>

                <h4 className="rd-prof-h">Executive Summary & Entry Barriers</h4>
                <ul className="rd-prof-list">
                  {currentProfile.glance.map((b, i) => <li key={i}>{b}</li>)}
                </ul>

                <h4 className="rd-prof-h">Statutory & Fiscal Parameters</h4>
                <div className="rd-tablewrap">
                  <table className="rd-table">
                    <thead><tr><th>Indicator</th><th>Audited Value</th><th>Source</th><th>Basis</th></tr></thead>
                    <tbody>
                      {[
                        ["Population", currentProfile.fields.population, "National Census", "Official"],
                        ["Total Online GGR", "$" + (currentProfile.fields.online_ggr / 1e6).toFixed(0) + "M", "Regulator / Consensus", "Reported"],
                        ["Initial License Surcharge", currentProfile.fields.app_fee, "Gazette Decree", "Official"],
                        ["Statutory Gaming Tax", currentProfile.fields.tax_label, "Tax Code", "Official"],
                        ["Bank Guarantee / Bond", currentProfile.fields.bank_guarantee, "Licensing Norms", "Official"],
                        ["Corporate Income Tax", currentProfile.fields.corporate_tax, "Tax Authority", "Official"]
                      ].map(([label, val, src, basis], i) => (
                        <tr key={i}>
                          <td><strong>{label}</strong></td>
                          <td>{val}</td>
                          <td>{src}</td>
                          <td><span className="rd-basis" style={{ color: basis === "Official" ? "#14502B" : "#8A5A00" }}>{basis}</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <h4 className="rd-prof-h">Upcoming Regulatory Timeline</h4>
                <div className="rd-tablewrap">
                  <table className="rd-table">
                    <thead><tr><th>Statutory Decree / Amendment</th><th>Stage</th><th>Expected</th><th>Impact</th></tr></thead>
                    <tbody>
                      {currentProfile.upcoming.map((u, i) => (
                        <tr key={i}>
                          <td><strong>{u.item}</strong></td>
                          <td>{u.stage}</td>
                          <td>{u.expected}</td>
                          <td><span className={`rd-tone ${u.impact === "High" ? "rd-tone-red" : "rd-tone-amber"}`}>{u.impact}</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </section>
          )}

          {/* 3. FINANCIAL MODELING (DCF / NPV / PAYBACK / SCENARIOS) */}
          {tab === "compare" && (
            <section className="rd-vol rd-vol-cmp" aria-label="Financial Modeling">
              <div className="rd-vol-head">
                <div>
                  <h2>Financial Feasibility & Valuation Engine (DCF / NPV)</h2>
                  <p>Model financial returns across Greenfield entry vs. M&A acquisition with multi-year cash flow projections, EBITDA, and payback.</p>
                </div>
                <div className="rd-row">
                  <div className="rd-seg">
                    <button aria-pressed={modelMode === "greenfield"} onClick={() => setModelMode("greenfield")}>Greenfield Entry</button>
                    <button aria-pressed={modelMode === "m_and_a"} onClick={() => setModelMode("m_and_a")}>M&A Buyout (4.5x EBITDA)</button>
                  </div>
                </div>
              </div>

              {/* Assumptions Sandbox */}
              <div className="rd-panel">
                <h3 className="rd-h">Investment Assumptions Sandbox</h3>
                <div className="rd-cmp-calc">
                  <label>
                    Target Market Share (%)
                    <input className="rd-input" type="number" step="0.5" value={targetShare} onChange={e => setTargetShare(parseFloat(e.target.value) || 0)} />
                  </label>
                  <label>
                    Monthly ARPU ($)
                    <input className="rd-input" type="number" value={arpu} onChange={e => setArpu(parseFloat(e.target.value) || 0)} />
                  </label>
                  <label>
                    Platform Royalty (%)
                    <input className="rd-input" type="number" value={platformRoyalty} onChange={e => setPlatformRoyalty(parseFloat(e.target.value) || 0)} />
                  </label>
                  <label>
                    Marketing / CPA (%)
                    <input className="rd-input" type="number" value={marketingPct} onChange={e => setMarketingPct(parseFloat(e.target.value) || 0)} />
                  </label>
                  <label>
                    Local Headcount (FTE)
                    <input className="rd-input" type="number" value={headcount} onChange={e => setHeadcount(parseInt(e.target.value) || 0)} />
                  </label>
                  <label>
                    Hurdle Rate / WACC (%)
                    <input className="rd-input" type="number" value={waccRate} onChange={e => setWaccRate(parseFloat(e.target.value) || 0)} />
                  </label>
                </div>
              </div>

              {/* Projections Table */}
              <div className="rd-tablewrap">
                <table className="rd-table">
                  <thead>
                    <tr>
                      <th>Target Market</th>
                      <th>Online Market</th>
                      <th>Our Proj. GGR</th>
                      <th>Act. Players</th>
                      <th>Gaming Tax</th>
                      <th>Annual EBITDA</th>
                      <th>Initial Outlay</th>
                      <th>Payback</th>
                      <th>3-Yr NPV ({waccRate}%)</th>
                    </tr>
                  </thead>
                  <tbody>
                    {Object.keys(profiles).map(k => {
                      const prof = profiles[k];
                      const mktGgr = prof.fields.online_ggr;
                      const projGgr = mktGgr * (targetShare / 100);
                      const players = Math.round(projGgr / (arpu * 12));
                      const tax = projGgr * prof.fields.tax_rate;
                      const royalty = projGgr * (platformRoyalty / 100);
                      const mktg = projGgr * (marketingPct / 100);
                      const opex = headcount * 45000;
                      const ebitda = projGgr - (tax + royalty + mktg + opex);

                      const outlay = modelMode === "greenfield" 
                        ? prof.fields.upfront_usd 
                        : Math.max(0, ebitda * 4.5);

                      const payback = ebitda > 0 ? (outlay / ebitda).toFixed(1) + " yrs" : "Negative";
                      const r = waccRate / 100;
                      const npv = -outlay + (ebitda * 0.8 / (1 + r)) + (ebitda / Math.pow(1 + r, 2)) + (ebitda * 1.15 / Math.pow(1 + r, 3));

                      return (
                        <tr key={k}>
                          <td><strong>{prof.country}</strong></td>
                          <td>${(mktGgr / 1e6).toFixed(0)}M</td>
                          <td style={{ color: "var(--brand)", fontWeight: 700 }}>${(projGgr / 1e6).toFixed(2)}M</td>
                          <td>{players.toLocaleString()}</td>
                          <td className="rd-down">${(tax / 1e6).toFixed(2)}M</td>
                          <td style={{ fontWeight: 800, color: ebitda >= 0 ? "var(--ok)" : "var(--danger)" }}>
                            ${(ebitda / 1e6).toFixed(2)}M
                          </td>
                          <td>${(outlay / 1e6).toFixed(2)}M</td>
                          <td><strong>{payback}</strong></td>
                          <td style={{ fontWeight: 800, color: npv >= 0 ? "var(--ok)" : "var(--danger)" }}>
                            ${(npv / 1e6).toFixed(2)}M
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              {/* Multi-Factor Attractiveness Index */}
              <div className="rd-panel" style={{ marginTop: 18 }}>
                <h3 className="rd-h">Multi-Factor Attractiveness Scoring Matrix</h3>
                <div className="rd-cmp-weights">
                  {Object.keys(weights).map(w => (
                    <label key={w} className="rd-cmp-weight">
                      <span style={{ textTransform: "capitalize" }}>{w}</span>
                      <input type="range" min="1" max="10" value={weights[w]} onChange={e => setWeights({ ...weights, [w]: parseInt(e.target.value) })} />
                      <output>{weights[w]}</output>
                    </label>
                  ))}
                </div>

                <div style={{ display: "grid", gap: 8, marginTop: 12 }}>
                  {[
                    { country: "Brazil", score: 86, note: "Substantial online GGR runway ($3.2B) and moderate 12% tax offset $5.2M license lockup." },
                    { country: "Romania", score: 72, note: "Mature and stable framework, though 21% GGR tax rate and €5M bond pinch early margins." },
                    { country: "Armenia", score: 70, note: "High digital penetration (~76%) with strong player demand, offset by saturated tier-1 domestic operator positions." }
                  ].map((row, i) => (
                    <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", background: "#fff", border: "1px solid var(--line)", borderRadius: 8 }}>
                      <div>
                        <strong>#{i + 1} {row.country}</strong> — <span className="rd-tone rd-tone-green">Index: {row.score}/100</span>
                        <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 2 }}>{row.note}</div>
                      </div>
                      <div className="rd-scorebar" style={{ width: 120 }}>
                        <div style={{ width: `${row.score}%` }} />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>
          )}

          {/* 4. GGR TRACKER */}
          {tab === "ggr" && (
            <section className="rd-vol" aria-label="GGR Volume Tracker">
              <div className="rd-vol-head">
                <div>
                  <h2>Market Volume (GGR) Memory Table</h2>
                  <p>Archived gross gaming revenue, handle, and turnover figures parsed from official sources.</p>
                </div>
                <button className="rd-btn" onClick={() => {
                  const head = ["Country", "Period", "Segment", "Metric", "Amount", "Change", "Source", "Published"].join(",");
                  const rows = ggrRows.map(r => [r.country, r.period, r.segment, r.metric, r.amount, r.change, r.source, r.published].map(csvCell).join(","));
                  const blob = new Blob([[head, ...rows].join("\n")], { type: "text/csv;charset=utf-8" });
                  const a = document.createElement("a");
                  a.href = URL.createObjectURL(blob);
                  a.download = `ggr-data-${new Date().toISOString().slice(0, 10)}.csv`;
                  a.click();
                }}>
                  Export CSV
                </button>
              </div>

              <div className="rd-tablewrap">
                <table className="rd-table">
                  <thead>
                    <tr><th>Country</th><th>Period</th><th>Segment</th><th>Metric</th><th>Amount</th><th>Change</th><th>Source</th><th>Published</th></tr>
                  </thead>
                  <tbody>
                    {ggrRows.map(r => (
                      <tr key={r.id}>
                        <td><strong>{r.country}</strong></td>
                        <td>{r.period}</td>
                        <td>{r.segment}</td>
                        <td>{r.metric}</td>
                        <td className="rd-amt">{r.amount}</td>
                        <td className={r.change.startsWith("+") ? "rd-up" : "rd-down"}>{r.change}</td>
                        <td>{r.source}</td>
                        <td>{r.published}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </section>
          )}

          {/* 5. CAC TRACKER */}
          {tab === "cac" && (
            <section className="rd-vol rd-vol-cac" aria-label="Customer Acquisition Cost Tracker">
              <div className="rd-vol-head">
                <div>
                  <h2>Customer Acquisition Cost (CAC) Tracker</h2>
                  <p>Audited acquisition benchmarks: CPA, cost per first-time depositor (FTD), and marketing spend.</p>
                </div>
                <button className="rd-btn" onClick={() => {
                  const head = ["Country", "Company", "Period", "Segment", "Metric", "Amount", "Change", "Source"].join(",");
                  const rows = cacRows.map(r => [r.country, r.company, r.period, r.segment, r.metric, r.amount, r.change, r.source].map(csvCell).join(","));
                  const blob = new Blob([[head, ...rows].join("\n")], { type: "text/csv;charset=utf-8" });
                  const a = document.createElement("a");
                  a.href = URL.createObjectURL(blob);
                  a.download = `cac-data-${new Date().toISOString().slice(0, 10)}.csv`;
                  a.click();
                }}>
                  Export CSV
                </button>
              </div>

              <div className="rd-tablewrap">
                <table className="rd-table">
                  <thead>
                    <tr><th>Country</th><th>Entity</th><th>Period</th><th>Vertical</th><th>Metric</th><th>Amount</th><th>Change</th><th>Source</th></tr>
                  </thead>
                  <tbody>
                    {cacRows.map(r => (
                      <tr key={r.id}>
                        <td><strong>{r.country}</strong></td>
                        <td>{r.company}</td>
                        <td>{r.period}</td>
                        <td>{r.segment}</td>
                        <td>{r.metric}</td>
                        <td className="rd-amt">{r.amount}</td>
                        <td className={r.change.startsWith("+") ? "rd-down" : "rd-up"}>{r.change}</td>
                        <td>{r.source}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </section>
          )}

          {/* 6. REGULATORY ROADMAP */}
          {tab === "timeline" && (
            <section className="rd-vol" aria-label="Regulatory Roadmap">
              <div className="rd-vol-head">
                <div>
                  <h2>Global Regulatory Implementation Roadmap</h2>
                  <p>Scheduled legislative milestones, technical certification cutoffs, and regulatory transition gates.</p>
                </div>
              </div>

              <div style={{ position: "relative", borderLeft: "3px solid var(--brand)", marginLeft: 16, paddingLeft: 24, display: "grid", gap: 24 }}>
                {[
                  { date: "Q1 2027", country: "Armenia", title: "Mandatory Real-Time SRC Telemetry API Integration", desc: "Licensed platforms must establish direct real-time data streaming of all wagers and tax deductions to the State Revenue Committee servers.", impact: "High" },
                  { date: "Q2 2027", country: "Romania", title: "Class 1 Operator National Self-Exclusion Central Gateway", desc: "Mandatory API query against the national self-exclusion registry prior to permitting player session initialization.", impact: "High" },
                  { date: "Q3 2027", country: "Brazil", title: "Mandatory Biometric Liveness Protocol Enforcement", desc: "SPA requires certified facial liveness verification on player account opening and withdrawal requests.", impact: "Medium" }
                ].map((ev, i) => (
                  <div key={i} style={{ position: "relative" }}>
                    <div style={{ position: "absolute", left: -31, top: 2, width: 14, height: 14, borderRadius: "50%", background: "var(--brand)", border: "3px solid #fff" }} />
                    <div className="rd-panel" style={{ margin: 0 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                        <span style={{ fontSize: 12, fontWeight: 800, color: "var(--brand)" }}>{ev.date} • {ev.country}</span>
                        <span className={`rd-tone ${ev.impact === "High" ? "rd-tone-red" : "rd-tone-amber"}`}>{ev.impact} Impact</span>
                      </div>
                      <h4 style={{ margin: "2px 0 6px", fontSize: 16 }}>{ev.title}</h4>
                      <p style={{ margin: 0, fontSize: 13.5, color: "var(--ink-2)" }}>{ev.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
            </section>
          )}

          {/* 7. SOURCES & EXCEL PIPELINE */}
          {tab === "sources" && (
            <section className="rd-vol" aria-label="Sources and Settings">
              <div className="rd-vol-head">
                <div>
                  <h2>Data Pipeline & OneDrive / Excel Bridge</h2>
                  <p>Manage central market workbook synchronization, custom intelligence scrapers, and data ingestion parameters.</p>
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(320px, 1fr))", gap: 16 }}>
                <div className="rd-panel">
                  <h3 className="rd-h">SharePoint / OneDrive Master File Bridge</h3>
                  <p className="rd-status">Connects to your internal market tracking workbook for two-way synchronization via Claude in Excel.</p>
                  <input
                    className="rd-input"
                    readOnly
                    value="https://digitainllc-my.sharepoint.com/.../New%20Market%20List-%20FINAL.xlsx"
                    style={{ margin: "10px 0", fontSize: 13, background: "var(--surface-2)" }}
                  />
                  <button className="rd-btn" onClick={() => alert("Workbook connection active and synchronized.")}>Test Connection</button>
                </div>

                <div className="rd-panel">
                  <h3 className="rd-h">Active Intelligence Subscriptions</h3>
                  <div style={{ display: "grid", gap: 8, marginTop: 8 }}>
                    {[
                      { name: "SBC Americas & SBC News", type: "Newsletter / RSS" },
                      { name: "iGaming Business (iGB)", type: "Regulatory Gazette" },
                      { name: "VIXIO GamblingCompliance", type: "Statutory Law Crawler" },
                      { name: "@GamingRegWatch", type: "Telegram Channel" }
                    ].map((s, i) => (
                      <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 10px", background: "var(--surface-2)", borderRadius: 6, fontSize: 13.5 }}>
                        <span><strong>{s.name}</strong> ({s.type})</span>
                        <span className="rd-up">✓ Active</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </section>
          )}
        </div>
      );
    }

    ReactDOM.render(<RegulatoryDeskApp />, document.getElementById("root"));
  </script>
</body>
</html>
